[project]
name = "oop-lab-2"
version = "0.1.0"
description = "Faculty Electronic Archive XML Document Processing and XSLT Transformation"
readme = "README.md"
authors = [
    { name = "Kryvko Dariya", email = "krivko.dariya@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "lxml>=6.1.3",
    "pyqt6>=6.12.1",
]

[project.scripts]
app = "src.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "src"
